name: Quality (analyze + tests)

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true
      - name: Install dependencies
        working-directory: ./mobile
        run: flutter pub get
      - name: Analyze (fails on errors and warnings)
        working-directory: ./mobile
        run: dart analyze
      - name: Unit & widget tests
        working-directory: ./mobile
        run: flutter test

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: ./web
        run: npm ci
      - name: Lint
        working-directory: ./web
        run: npm run lint
      - name: Type check
        working-directory: ./web
        run: npx tsc --noEmit
      - name: Unit tests
        working-directory: ./web
        run: npm test

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: supabase/tests/package-lock.json
      - name: Install PGlite
        working-directory: ./supabase/tests
        run: npm ci
      - name: Apply all migrations and run permission/logic tests
        working-directory: ./supabase/tests
        run: npm test
