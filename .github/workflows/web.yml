name: Web Dashboard

on:
  push:
    branches: [ "main" ]
    paths: [ "web/**", ".github/workflows/web.yml" ]
  pull_request:
    paths: [ "web/**", ".github/workflows/web.yml" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, test & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Build static site
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

      - name: Upload static build
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: web-out
          path: web/out
          retention-days: 7

  deploy:
    name: Deploy to Surge
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    env:
      # Add a repository secret named SURGE_TOKEN (from `npx surge token`) to enable deploys.
      # The token's Surge account must own every domain listed here.
      SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
      SURGE_DOMAINS: batra-hr-pro.surge.sh hr-batra.surge.sh
    steps:
      - name: Download static build
        uses: actions/download-artifact@v4
        with:
          name: web-out
          path: out

      - name: Check SURGE_TOKEN
        if: env.SURGE_TOKEN == ''
        run: |
          echo "::error::SURGE_TOKEN secret is not set, so the site was not deployed to $SURGE_DOMAINS. Add it under Settings > Secrets and variables > Actions."
          exit 1

      - name: Publish to Surge
        if: env.SURGE_TOKEN != ''
        run: |
          for domain in $SURGE_DOMAINS; do
            echo "Publishing to https://$domain"
            npx --yes surge@0.44 ./out "$domain" --token "$SURGE_TOKEN"
          done
