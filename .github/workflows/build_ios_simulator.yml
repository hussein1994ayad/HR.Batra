name: Build iOS Simulator App

# نسخة محاكي آيفون للتجربة بالمتصفح (Appetize.io) أو أي منصة تجربة سحابية.
# Appetize يحتاج: ملف .zip بداخله Runner.app مباشرة (بدون مجلد Payload)، ومبني للمعماريتين
# (أجهزتهم Intel و Apple Silicon)، وإلا يطلع "Unexpected error occurred" عند التشغيل.

on:
  push:
    branches: [ "main", "design-v2" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: ./mobile
        run: flutter pub get

      - name: Build iOS Simulator App (arm64 + x86_64)
        working-directory: ./mobile
        run: |
          # يجهّز إعدادات Flutter والـ pods، ثم البناء بـ xcodebuild للمعماريتين
          flutter build ios --simulator --config-only
          cd ios
          xcodebuild -workspace Runner.xcworkspace -scheme Runner -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ../build/appetize \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build | tail -20
          APP=../build/appetize/Build/Products/Debug-iphonesimulator/Runner.app
          echo "--- architectures:"; lipo -info "$APP/Runner"
          echo "--- minimum iOS:"; /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist"

      - name: Package for Appetize (.zip) and cloud testing (.ipa)
        working-directory: ./mobile/build/appetize/Build/Products/Debug-iphonesimulator
        run: |
          mkdir -p ../../../../../dist
          zip -qry ../../../../../dist/HRBatra_Appetize.zip Runner.app
          mkdir Payload && cp -R Runner.app Payload/ && zip -qry ../../../../../dist/HRBatra_Simulator.ipa Payload
          ls -la ../../../../../dist

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HRBatra-iOS-Simulator-App
          path: mobile/dist/*
          if-no-files-found: error
